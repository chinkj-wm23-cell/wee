<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>情人节快乐 💐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="badge">💝</div>
      <h1>情人节快乐</h1>
      <p class="sub">送你一束会“开花”的网页花花 💐</p>
    </header>

    <section class="card">
      <canvas id="c"></canvas>

      <div class="overlay">
        <div class="heart" aria-hidden="true"></div>
        <div class="msg">
          <div class="line">愿你今天被温柔包围</div>
          <div class="line small">Happy Valentine’s Day ✨</div>
        </div>

        <div class="controls">
          <button id="btnBloom" class="btn">再开一波花 🌸</button>
          <button id="btnSave" class="btn ghost" title="保存为图片（截屏方式）">我知道了 ✅</button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <span>提示：把文件发给对方，手机打开 index.html 就能看到。</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
